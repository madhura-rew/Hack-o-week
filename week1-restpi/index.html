<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REST API Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      color: #333;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #6c5ce7;
    }
    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #5b4cc4;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .action-btn {
      margin-left: 5px;
    }
    .edit-btn {
      background: #00b894;
    }
    .edit-btn:hover {
      background: #00a383;
    }
    .delete-btn {
      background: #ff7675;
    }
    .delete-btn:hover {
      background: #d63031;
    }
    .empty {
      text-align: center;
      color: #aaa;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>📝 Library management system </h1>

  <div class="form-group">
    <input type="text" id="itemInput" placeholder="Enter book name..." />
    <button onclick="addItem()">Add</button>
  </div>

  <ul id="itemList">
    <!-- Items will appear here -->
  </ul>

  <script>
    const API_URL = 'http://localhost:3000/items';

    // Load all items
    async function loadItems() {
      try {
        const res = await fetch(API_URL);
        const items = await res.json();
        const list = document.getElementById('itemList');

        if (items.length === 0) {
          list.innerHTML = '<li class="empty">No items yet. Add one above!</li>';
          return;
        }

        list.innerHTML = items
          .map(item => `
            <li>
              <span id="name-${item.id}">${item.name}</span>
              <div>
                <button class="action-btn edit-btn" onclick="editItem(${item.id})">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteItem(${item.id})">Delete</button>
              </div>
            </li>
          `)
          .join('');
      } catch (err) {
        console.error('Error loading items:', err);
        document.getElementById('itemList').innerHTML = '<li class="empty">Failed to load items.</li>';
      }
    }

    // Add a new item
    async function addItem() {
      const input = document.getElementById('itemInput');
      const name = input.value.trim();
      if (!name) return alert('Please enter book name!');

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        input.value = '';
        loadItems();
      } catch (err) {
        console.error('Error adding item:', err);
        alert('Failed to add item.');
      }
    }

    // Edit an item
    async function editItem(id) {
      const currentName = document.getElementById(`name-${id}`).innerText;
      const newName = prompt('Edit item name:', currentName);
      if (!newName || newName.trim() === '') return;

      try {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName.trim() })
        });
        loadItems();
      } catch (err) {
        console.error('Error editing item:', err);
        alert('Failed to update item.');
      }
    }

    // Delete an item
    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;

      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadItems();
      } catch (err) {
        console.error('Error deleting item:', err);
        alert('Failed to delete item.');
      }
    }

    // Load items on page load
    loadItems();
  </script>
</body>
</html>
